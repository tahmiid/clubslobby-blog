     the next `ads-switch.sh on` replaces everything between these markers. -->
<style>
/* Height is reserved HERE, in <head>, and not by the script below. The space
   therefore exists before the first paint and the <ins> that arrives later
   drops into a box that is already the right size. Insert the container from
   JavaScript instead and every line beneath it moves — that is Cumulative
   Layout Shift, a ranking signal, on a site whose only acquisition channel is
   search (MONETIZATION.md §4).

   Only slots with a unit id below are listed. A slot reserving 280px with
   nothing to put in it is just a hole in the article, so the two lists are
   checked against each other by ads-switch.sh before this is ever applied. */
.pchq-ad[data-ad="a"] { display:block; margin:2.2em 0; min-height:280px; text-align:center; }
@media (min-width:768px) {
  .pchq-ad[data-ad="a"] { min-height:250px; }
}

/* …and give the space back when Google has nothing to put in it. AdSense
   marks the <ins> `data-ad-status="unfilled"` when it answers with no ad, and
   without this the reserved height stands as a blank 280–375px hole between a
   paragraph and the next heading — measured on the Magician build the day
   ads went live, while the site was still filling at 0%. A hole is worse than
   no ad slot at all.

   The collapse is itself a layout shift and it is not free: measured **CLS
   0.086** on the spoke articles the day this shipped, against 0.000 with the
   hole left in. Both are inside Google's "good" band (<=0.1) and the second
   is not worth having, so the shift is the better trade — but only while the
   fill rate is 0%. Every load collapses, so every load shifts.

   **Once AdSense fills, this rule stops firing and CLS returns to ~0**, which
   is the whole reason the height is reserved in the first place. If fill
   stays at 0% for more than a day, `ads-switch.sh verify` is strictly better
   than `on`: it earns the same nothing and costs neither the shift nor the
   script. */
.pchq-ad:has(ins[data-ad-status="unfilled"]) { display:none; }
</style>
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7746895194950296" crossorigin="anonymous"></script>
<script>
(function () {
  // Slot name -> AdSense display unit id. An empty string means "not live":
  // the marker stays an empty div and costs nothing. That is how
  // MONETIZATION.md §8 turns on A and D first and holds B and C for 30 days
  // of measured RPM and Core Web Vitals.
  //
  // Adding a letter here means adding it to the CSS above too. ads-switch.sh
  // refuses to apply this file if the two disagree.
  //
  // **d is empty on purpose and its unit id is real: 6383559998.** Slot D is
  // the blog index, which the Ghost theme renders — our generators never see
  // it, so no `data-ad="d"` marker exists for the filler to find. Giving it an
  // id here would load a unit that can never render and report zero forever.
  // Placing it needs either a theme edit (`index.hbs`, and Ghost upgrades
  // revert those — DEPLOYMENT.md §7's Casper note) or an index-only insertion
  // rule here. Until one of those exists, D stays dark.
  var UNITS = { a: '6898565314', b: '', c: '', d: '' };

  function fill() {
    var boxes = document.querySelectorAll('.pchq-ad[data-ad]');
    for (var i = 0; i < boxes.length; i++) {
      var box = boxes[i];
      var unit = UNITS[box.getAttribute('data-ad')];
      if (!unit || box.getAttribute('data-filled')) continue;
      box.setAttribute('data-filled', '1');
      var ins = document.createElement('ins');
      ins.className = 'adsbygoogle';
      ins.style.display = 'block';
      ins.setAttribute('data-ad-client', 'ca-pub-7746895194950296');
      ins.setAttribute('data-ad-slot', unit);
      ins.setAttribute('data-ad-format', 'auto');
      ins.setAttribute('data-full-width-responsive', 'true');
      box.appendChild(ins);
      (window.adsbygoogle = window.adsbygoogle || []).push({});
    }
  }

  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', fill);
  else fill();
})();
</script>
<!-- pchq-ads:end -->
