<style>
.hm27{--s1:#fcfcfb;--ink:#0b0b0b;--ink2:#52514e;--muted:#898781;--grid:#e1e0d9;--ring:rgba(11,11,11,.10);
  --accent:#256abf;--accent2:#86b6ef;--bar:#e1e0d9;--good:#0ca30c;--bad:#d03b3b;
  font-family:system-ui,-apple-system,"Segoe UI",sans-serif;color:var(--ink);background:var(--s1);
  border:1px solid var(--ring);border-radius:12px;padding:20px;margin:0 0 1.6em;font-size:15px;line-height:1.45}
@media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .hm27{
  --s1:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--grid:#2c2c2a;--ring:rgba(255,255,255,.10);
  --accent:#6da7ec;--accent2:#256abf;--bar:#2c2c2a;--bad:#e66767}}
:root[data-theme="dark"] .hm27{--s1:#1a1a19;--ink:#fff;--ink2:#c3c2b7;--grid:#2c2c2a;--ring:rgba(255,255,255,.10);
  --accent:#6da7ec;--accent2:#256abf;--bar:#2c2c2a;--bad:#e66767}
.hm27 *{box-sizing:border-box}
.hm27 .hd{font-size:17px;font-weight:650;margin:0 0 2px}
.hm27 .sub{font-size:13px;color:var(--ink2);margin:0 0 14px}
.hm27 .lbl{display:block;font-size:12px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);margin-bottom:7px}
.hm27 .chips{display:flex;flex-wrap:wrap;gap:6px}
.hm27 .chip{font:inherit;font-size:12.5px;padding:5px 12px;border-radius:999px;border:1px solid var(--ring);
  background:transparent;color:var(--ink2);cursor:pointer}
.hm27 .chip:hover{border-color:var(--muted)}
.hm27 .chip[aria-pressed="true"]{background:var(--ink);color:var(--s1);border-color:var(--ink)}
.hm27 .chip[disabled]{opacity:.32;cursor:not-allowed}
.hm27 .foot{margin-top:14px;font-size:11.5px;color:var(--muted)}
@media (max-width:600px){.hm27{padding:14px}}
  .hm27 .s0{--c:#86b6ef;--ct:#0b0b0b}.hm27 .s1{--c:#3987e5;--ct:#0b0b0b}.hm27 .s2{--c:#256abf;--ct:#ffffff}.hm27 .s3{--c:#184f95;--ct:#ffffff}.hm27 .s4{--c:#0d366b;--ct:#ffffff}
  @media (prefers-color-scheme:dark){:root:where(:not([data-theme="light"])) .hm27 .s0{--c:#184f95;--ct:#ffffff}:root:where(:not([data-theme="light"])) .hm27 .s1{--c:#256abf;--ct:#ffffff}:root:where(:not([data-theme="light"])) .hm27 .s2{--c:#3987e5;--ct:#0b0b0b}:root:where(:not([data-theme="light"])) .hm27 .s3{--c:#6da7ec;--ct:#0b0b0b}:root:where(:not([data-theme="light"])) .hm27 .s4{--c:#9ec5f4;--ct:#0b0b0b}}
  :root[data-theme="dark"] .hm27 .s0{--c:#184f95;--ct:#ffffff}:root[data-theme="dark"] .hm27 .s1{--c:#256abf;--ct:#ffffff}:root[data-theme="dark"] .hm27 .s2{--c:#3987e5;--ct:#0b0b0b}:root[data-theme="dark"] .hm27 .s3{--c:#6da7ec;--ct:#0b0b0b}:root[data-theme="dark"] .hm27 .s4{--c:#9ec5f4;--ct:#0b0b0b}
.hm27 .hint{font-size:12.5px;color:var(--muted);margin:0 0 8px}
.hm27 .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.hm27 .scroll{overflow-x:auto;-webkit-overflow-scrolling:touch}
.hm27 table{border-collapse:separate;border-spacing:2px;width:100%;min-width:520px}
.hm27 th{font-size:11.5px;font-weight:600;letter-spacing:.03em;text-transform:uppercase;color:var(--muted);text-align:center;padding:0 0 6px}
.hm27 .rh{text-align:left!important;white-space:nowrap;padding-right:10px!important;text-transform:none!important;letter-spacing:0!important}
.hm27 .rb{font:inherit;font-size:13px;font-weight:600;color:var(--ink);background:none;border:0;padding:0;cursor:pointer;display:block}
.hm27 .rb:hover{text-decoration:underline}
.hm27 .pos{display:block;font-size:11px;font-weight:400;color:var(--muted)}
.hm27 td{background:var(--c);color:var(--ct);text-align:center;font-size:13px;font-variant-numeric:tabular-nums;
  padding:9px 4px;border-radius:4px;min-width:62px;position:relative}
.hm27 td:focus-visible,.hm27 td:hover{outline:2px solid var(--ink);outline-offset:-2px}
.hm27 .lg{display:flex;align-items:center;gap:8px;margin-top:12px;font-size:12px;color:var(--muted)}
.hm27 .k{width:19px;height:9px;background:var(--c);display:inline-block;border-radius:2px}
.hm27 .tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--s1);font-size:12.5px;
  padding:7px 10px;border-radius:7px;opacity:0;transition:opacity .1s;max-width:230px;line-height:1.35}
.hm27 .tip b{display:block;font-size:13px}
.hm27 .det{margin-top:20px;padding-top:16px;border-top:1px solid var(--grid)}
.hm27 .det h4{margin:0;font-size:17px}
.hm27 .det .who{margin:1px 0 8px;font-size:12.5px;color:var(--muted)}
.hm27 .det .desc{margin:0 0 13px;font-size:14px;color:var(--ink2);max-width:60ch}
.hm27 .bars{display:grid;gap:7px;margin-bottom:15px}
.hm27 .bar{display:grid;grid-template-columns:94px 1fr 78px;align-items:center;gap:10px}
.hm27 .bl{font-size:12.5px;color:var(--ink2)}
.hm27 .bt{position:relative;height:12px;background:var(--bar);border-radius:6px}
.hm27 .bf{position:absolute;top:0;height:12px;background:var(--c);border-radius:6px;min-width:6px}
.hm27 .bv{font-size:12px;font-variant-numeric:tabular-nums;color:var(--muted);text-align:right}
.hm27 .meta{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:18px}
.hm27 h5{margin:0 0 6px;font-size:11.5px;text-transform:uppercase;letter-spacing:.04em;color:var(--muted)}
.hm27 .meta ul{margin:0;padding-left:16px;font-size:13.5px;color:var(--ink2)}
.hm27 .meta li{margin-bottom:5px}
@media (max-width:600px){.hm27 .bar{grid-template-columns:80px 1fr 70px;gap:7px}}
</style>
