<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 1000" role="img" aria-labelledby="title desc">
  <title id="title">Pro Clubs HQ — Emerald Aurora circle</title>
  <desc id="desc">A centered, maximized HQ-and-triangle mark punched through a perfect emerald-to-teal-to-royal-blue gradient circle as transparent cutouts.</desc>

  <defs>
    <radialGradient id="circle-gradient" gradientUnits="objectBoundingBox" cx="34%" cy="25%" r="82%">
      <stop offset="0" stop-color="#2BCB8C"/>
      <stop offset="0.50" stop-color="#078D86"/>
      <stop offset="1" stop-color="#1B51B6"/>
    </radialGradient>
    <linearGradient id="top-gradient" gradientUnits="userSpaceOnUse" x1="230" y1="180" x2="770" y2="180">
      <stop offset="0" stop-color="#DBFF50"/>
      <stop offset="0.5" stop-color="#78F5A5"/>
      <stop offset="1" stop-color="#68D7FF"/>
    </linearGradient>
    <linearGradient id="left-gradient" gradientUnits="userSpaceOnUse" x1="185" y1="258" x2="455" y2="726">
      <stop offset="0" stop-color="#68D7FF"/>
      <stop offset="0.5" stop-color="#79F3BC"/>
      <stop offset="1" stop-color="#DBFF50"/>
    </linearGradient>
    <linearGradient id="right-gradient" gradientUnits="userSpaceOnUse" x1="815" y1="258" x2="545" y2="726">
      <stop offset="0" stop-color="#78F5A5"/>
      <stop offset="0.5" stop-color="#68D7FF"/>
      <stop offset="1" stop-color="#7390FF"/>
    </linearGradient>
    <!-- HQ converted to paths so its shape is independent of installed fonts. -->
    <g id="hq-lettering" transform="translate(500 420) skewX(-12) scale(0.82 1) translate(-500 -420)">
      <path
        transform="translate(152.771484 570) scale(0.205078125 -0.205078125)"
        d="M188 1493H573V924H1141V1493H1526V0H1141V633H573V0H188Z"
      />
      <path
        transform="translate(490.216797 570) scale(0.205078125 -0.205078125)"
        fill-rule="evenodd"
        d="M911 -27H881Q512 -27 307 177Q102 381 102 745Q102 1108 306.5 1314Q511 1520 870 1520Q1233 1520 1435.5 1316Q1638 1112 1638 745Q1638 493 1530.5 311Q1423 129 1221 37L1522 -299H1155ZM870 1241Q694 1241 597 1111Q500 981 500 745Q500 505 595 377.5Q690 250 870 250Q1047 250 1144 380Q1241 510 1241 745Q1241 981 1144 1111Q1047 1241 870 1241Z"
      />
    </g>

    <!-- Black areas in this mask remove the frame and leave true transparency. -->
    <mask id="frame-letter-knockout" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
      <rect x="0" y="0" width="1000" height="1000" fill="white"/>
      <use href="#hq-lettering" fill="black" stroke="black" stroke-width="200" stroke-linejoin="round"/>
    </mask>
    <mask id="circle-frame-cutouts" maskUnits="userSpaceOnUse" x="0" y="0" width="1000" height="1000">
      <rect x="0" y="0" width="1000" height="1000" fill="white"/>
      <g transform="translate(500 500) scale(1.13) translate(-500 -446.5)">
        <g fill="none" stroke="black" stroke-width="38" stroke-linecap="butt" mask="url(#frame-letter-knockout)">
          <line x1="230" y1="180" x2="770" y2="180"/>
          <line x1="185" y1="257.942286" x2="455" y2="725.596005"/>
          <line x1="815" y1="257.942286" x2="545" y2="725.596005"/>
        </g>
        <use href="#hq-lettering" fill="black"/>
      </g>
    </mask>
  </defs>

  <circle cx="500" cy="500" r="460" fill="url(#circle-gradient)" mask="url(#circle-frame-cutouts)"/>

  <!--
    Implied equilateral triangle vertices:
      A (140, 180), B (860, 180), C (500, 803.538291)
    Full side length: 720
    Each end is trimmed by 90, leaving three visible segments of length 540.
  -->
</svg>
